global:
  scrape_interval: 15s
scrape_configs:
  - job_name: core
    static_configs: [{ targets: ["core:3001"] }]
    metrics_path: /metrics
  - job_name: realtime
    static_configs: [{ targets: ["realtime:3002"] }]
    metrics_path: /metrics
  - job_name: games
    static_configs: [{ targets: ["games:3004"] }]
    metrics_path: /metrics
  - job_name: ai
    static_configs: [{ targets: ["ai:3005"] }]
    metrics_path: /metrics
