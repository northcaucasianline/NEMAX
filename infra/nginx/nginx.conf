events { worker_connections 4096; }
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  upstream core { server core:3001; }
  upstream realtime { server realtime:3002; }
  upstream games { server games:3004; }
  server {
    listen 80;
    client_max_body_size 32m;
    location /ws {
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
    }
    location /game-api/ {
      limit_req zone=api burst=120 nodelay;
      proxy_pass http://games;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
      limit_req zone=api burst=120 nodelay;
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
    }
    location /metrics { deny all; }
    location / { proxy_pass http://core; proxy_set_header Host $host; }
  }
}
