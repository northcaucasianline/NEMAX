<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/nemax-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>НЕМАКС — общение, города и игры</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c4dff" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // В режиме разработки удаляем старый Service Worker и Cache Storage до загрузки React.
      // Это предотвращает загрузку устаревших JSX-модулей и HMR-токена после обновления архива.
      if (["localhost", "127.0.0.1"].includes(location.hostname)) {
        navigator.serviceWorker?.getRegistrations?.().then((items) => items.forEach((item) => item.unregister())).catch(() => {});
        window.caches?.keys?.().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
